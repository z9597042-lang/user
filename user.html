<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل کاربری</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet" />

<style>
:root {
  --ink: #142433;
  --paper: #f4f7f6;
  --teal: #1f6f5c;
  --teal-deep: #14493c;
  --danger: #b23b3b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  font-family: "Vazirmatn", sans-serif;
  background: var(--paper);
  color: var(--ink);
}
.wrap {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.welcome {
  font-size: 34px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--teal-deep), var(--teal));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.error { background: var(--danger); }
</style>
</head>
<body>

  <div class="wrap">
    <h1 class="welcome">خوش آمدید</h1>
  </div>

  <div id="toast" class="toast">
    <span id="toastMessage"></span>
  </div>

<script>
// ============================================================
// API wrapper + JWT + Toast + مدیریت نشست ۲ ساعته
// همه چیز در همین یک فایل - محتوای صفحه فقط "خوش آمدید" است.
// ============================================================

// ===== API WRAPPER =====
(function () {
  const API_BASE_URL = "http://localhost:8080";
  const SERVICES = { profile: "" };

  window.API = {
    BASE_URL: API_BASE_URL,
    SERVICES: SERVICES,

    getToken() { return localStorage.getItem("token") || null; },
    setToken(token) { localStorage.setItem("token", token); },
    clearToken() { localStorage.removeItem("token"); },

    buildUrl(service, endpoint = "") {
      const servicePath = SERVICES[service];
      if (servicePath === undefined) throw new Error(`سرویس ${service} تعریف نشده است`);
      return `${API_BASE_URL}${servicePath}${endpoint}`;
    },

    async request(service, endpoint, options = {}) {
      return this.requestAbsolute(this.buildUrl(service, endpoint), options);
    },
    get(service, endpoint, options = {}) {
      return this.request(service, endpoint, { ...options, method: "GET" });
    },
    post(service, endpoint, body, options = {}) {
      return this.request(service, endpoint, { ...options, method: "POST", body: JSON.stringify(body) });
    },

    async requestAbsolute(url, options = {}) {
      const token = this.getToken();

      // Authorization همیشه در header ست می‌شود اگر توکنی وجود داشته باشد
      const headers = { "Content-Type": "application/json", ...options.headers };
      if (token) headers.Authorization = `Bearer ${token}`;

      const response = await fetch(url, { ...options, headers });
      const isLoginRequest = url.endsWith("/profile/login");

      if (response.status === 401 && !isLoginRequest) {
        this.clearToken();
        window.dispatchEvent(new CustomEvent("unauthorized"));
        throw new Error("جلسه شما منقضی شده است");
      }
      if (response.status === 403) throw new Error("شما دسترسی به این بخش را ندارید");
      if (response.status === 404) throw new Error("منبع مورد نظر یافت نشد");

      return response;
    },

    profile: {
      login: (data) => window.API.post("profile", "/login", data),
      logout: () => window.API.post("profile", "/logout", {}),
      getProfile: () => window.API.get("profile", "/profile"),
    },
  };
})();

// ===== JWT parsing =====
function parseJwt(token) {
  try {
    const base64Url = token.split(".")[1];
    const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
    const jsonPayload = decodeURIComponent(
      atob(base64).split("").map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""),
    );
    return JSON.parse(jsonPayload);
  } catch (error) {
    console.error("خطای JWT parsing:", error);
    return null;
  }
}

// ===== Toast =====
function showToastMessage(msg, isError = false) {
  const toast = document.getElementById("toast");
  const toastMessage = document.getElementById("toastMessage");
  if (!toast || !toastMessage) return;
  toastMessage.textContent = msg;
  toast.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove("show"), 4000);
}

// ===== مدیریت انقضای نشست (۲ ساعت) =====
(function () {
  let sessionTimer = null;

  function getTokenExpiryMs(token) {
    const payload = parseJwt(token);
    return payload && typeof payload.exp === "number" ? payload.exp * 1000 : null;
  }

  function clearAuthClientSide() {
    window.API.clearToken();
    document.cookie = "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    clearTimeout(sessionTimer);
    ["authState", "userData", "userRole"].forEach((k) => sessionStorage.removeItem(k));
  }

  // وقتی ۲ ساعت تموم بشه: اول درخواست logout به بک‌اند زده می‌شود
  // (با Authorization که هنوز پاک نشده)، بعد کاربر به لاگین برمی‌گردد.
  async function logoutDueToExpiry() {
    try {
      await window.API.profile.logout();
    } catch (err) {
      console.warn("⚠️ درخواست logout به بک‌اند ناموفق بود:", err);
    }
    clearAuthClientSide();
    showToastMessage("⏰ مدت زمان جلسه شما به پایان رسید.", true);
    setTimeout(() => window.location.replace("/login.html"), 1500);
  }

  function startSessionTimer() {
    clearTimeout(sessionTimer);
    const token = window.API.getToken();
    if (!token) return;

    const expiresAt = getTokenExpiryMs(token);
    const remaining = expiresAt ? expiresAt - Date.now() : 2 * 60 * 60 * 1000; // fallback ۲ ساعت

    if (remaining <= 0) { logoutDueToExpiry(); return; }
    sessionTimer = setTimeout(logoutDueToExpiry, remaining);
  }

  if (window.API.getToken()) startSessionTimer();

  window.addEventListener("unauthorized", function () {
    clearAuthClientSide();
    showToastMessage("جلسه شما منقضی شد. لطفاً دوباره وارد شوید.", true);
    setTimeout(() => window.location.replace("/login.html"), 1500);
  });

  console.log("✅ مدیریت نشست فعال شد (مبتنی بر exp توکن، fallback ۲ ساعت)");
})();

// ===== ورود به پنل یوزر =====
(function () {
  // اگر اصلاً توکنی وجود نداشته باشد، مستقیم به لاگین برگرد
  if (!window.API.getToken()) {
    window.location.replace("/login.html");
    return;
  }

  // درخواست به بک‌اند برای تأیید معتبر بودن نشست هنگام ورود به پنل
  // (Authorization: Bearer <token> به‌صورت خودکار در header قرار می‌گیرد)
  window.API.profile.getProfile().catch((error) => {
    // اگر 401 باشد، خودِ common logic بالا کاربر را به لاگین برمی‌گرداند؛
    // بقیه خطاها (مثلاً قطعی شبکه) فقط لاگ می‌شوند، محتوای صفحه ثابت می‌ماند
    console.warn("⚠️ خطا در تأیید نشست:", error);
  });
})();
</script>
</body>
</html>
